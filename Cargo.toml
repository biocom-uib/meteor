[workspace]
members = ["meteor-macros"]

[package]
name = "meteor"
authors = ["Gabriel Riera"]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
meteor-macros = { path = "./meteor-macros" }
anyhow = "1.0"
base64ct = { version = "~1.7.3", features = ["alloc"], optional = true }
bincode = "1.3"
clap = { version = "~4.5.37", features = ["derive", "env"] }
csv = "1.3"
directories = { version = "6.0.0", optional = true }
extended-rational = "1.3"
flate2 = "~1.1.1"
ftp = "~3.0.1"
generic-array = { version = "1.1", features = ["alloc"] }
intmap = { version = "~3.1.0", features = ["serde"] }
itertools = "0.14"
lending-iterator = "~0.1.7"
newick-rs = "0.2"
ordered-float = "5.0"
polars-arrow = "0.46.0"
polars-plan = "~0.46.0"
polars-utils = "~0.46.0"
progress-streams = "~1.1.0"
quick-xml = { version = "~0.37.4", optional = true }
range_minimum_query = "0.2.0"
rayon = "1.10"
regex = "~1.11.1"
reqwest = { version = "~0.12.15", features = ["blocking"], optional = true }
serde = "1.0"
serde_cbor = { version = "0.11", optional = true }
serde_json = "1.0"
sha2 = { version = "0.10.8", optional = true }
string-interner = { version = "0.19", features = ["serde"] }
tar = "~0.4.44"
tempdir = "~0.3.7"
thiserror = "2.0"
toml = { version = "0.8.20", optional = true }
walkdir = { version = "2.5.0", optional = true }
fs-lock = "0.1.10"
typed-path = "0.10.0"

[dependencies.polars]
version = "~0.46.0"
features = [
    "concat_str",
    "decompress",
    "dtype-struct",
    "lazy",
    "list_drop_nulls",
    "list_eval",
    "list_gather",
    "list_sets",
    "repeat_by",
    "replace",
    "streaming",
    "strings",
]

[features]
default = []
taxonomy-serialize-json = []
taxonomy-serialize-cbor = ["serde_cbor"]
ppin = ["quick-xml", "reqwest"]
refine_host_prediction_polars = []
containers = []
cache = ["base64ct", "directories", "sha2", "toml", "walkdir"]
